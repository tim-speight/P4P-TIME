- name: Install EPICS P4P systemd service
  template:
    src: epics-p4p.service.j2
    dest: /etc/systemd/system/epics-p4p.service
    mode: '0644'

- name: Reload systemd
  systemd:
    daemon_reload: yes

- name: Deploy EPICS P4P start.py script
  template:
    src: start.py.j2
    dest: "{{ epics_p4p_workdir | default('/opt/epics-p4p') }}/start.py"
    mode: '0755'

- name: Create virtualenv for EPICS P4P
  command: python3 -m venv {{ epics_p4p_venv | default('/opt/epics-p4p/venv') }}
  args:
    creates: "{{ epics_p4p_venv | default('/opt/epics-p4p/venv') }}/bin/activate"

- name: Install EPICS P4P dependencies
  pip:
    requirements: "{{ epics_p4p_workdir | default('/opt/epics-p4p') }}/requirements.txt"
    virtualenv: "{{ epics_p4p_venv | default('/opt/epics-p4p/venv') }}"

- name: Enable and start epics-p4p service
  systemd:
    name: epics-p4p
    enabled: yes
    state: started
