
---
- name: Install base packages
  apt:
    name:
      - chrony
      - gpsd
      - gpsd-clients
      - pps-tools
      - linuxptp
      - python3-venv
      - python3-pip
    state: present

- name: Disable systemd-timesyncd if present (chrony will own time)
  systemd:
    name: systemd-timesyncd
    state: stopped
    enabled: no
  ignore_errors: yes

# ----- Boot config / overlays -----
- name: Ensure /boot/config.txt contains UART + PPS overlays
  template:
    src: boot-config.txt.j2
    dest: /boot/config.txt
    owner: root
    group: root
    mode: 0644
  notify: Reboot if boot-config changed

- name: Disable Bluetooth modem service when BT disabled
  systemd:
    name: hciuart
    state: stopped
    enabled: no
  when: disable_bt_for_full_uart

# ----- MTK GPS pre-config (PMTK) before gpsd starts -----
- name: Install MTK config script
  template:
    src: configure_mtk_pmtk.py.j2
    dest: /usr/local/sbin/configure_mtk_pmtk.py
    owner: root
    group: root
    mode: 0755

- name: Install mtk-config systemd unit (runs before gpsd)
  template:
    src: mtk-config.service.j2
    dest: /etc/systemd/system/mtk-config.service
    owner: root
    group: root
    mode: 0644
  notify: Reload systemd

- name: Enable mtk-config
  systemd:
    name: mtk-config
    enabled: yes
    state: started

# ----- gpsd -----
- name: Configure /etc/default/gpsd
  template:
    src: gpsd-default.j2
    dest: /etc/default/gpsd
    owner: root
    group: root
    mode: 0644
  notify: Restart gpsd

- name: Enable gpsd
  systemd:
    name: gpsd
    enabled: yes
    state: started

# ----- chrony -----
- name: Configure chrony for NMEA + PPS stratum-1
  template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: 0644
  notify: Restart chrony

# ----- PTP (linuxptp) -----
- name: Install ptp4l.conf
  template:
    src: ptp4l.conf.j2
    dest: /etc/linuxptp/ptp4l.conf
    owner: root
    group: root
    mode: 0644

- name: Install ptp4l systemd unit (software timestamping)
  template:
    src: ptp4l.service.j2
    dest: /etc/systemd/system/ptp4l.service
    owner: root
    group: root
    mode: 0644
  notify: Reload systemd

- name: Enable and start ptp4l
  systemd:
    name: ptp4l
    enabled: yes
    state: started

# ----- EPICS P4P service -----
- name: Create epics user
  user:
    name: "{{ epics_user }}"
    group: "{{ epics_group }}"
    shell: /bin/bash
    create_home: no
    system: yes

- name: Create directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ epics_user }}"
    group: "{{ epics_group }}"
    mode: 0755
  loop:
    - "{{ epics_dir }}"
    - "{{ epics_dir }}/logs"

- name: Create venv (with system site packages)
  command: "python3 -m venv --system-site-packages {{ epics_venv }}"
  args:
    creates: "{{ epics_venv }}/bin/activate"

- name: Install p4p + epicscorelibs in venv
  pip:
    name:
      - epicscorelibs
      - p4p
    virtualenv: "{{ epics_venv }}"
    extra_args: "--upgrade"

- name: Install EPICS P4P GPS PV server script
  template:
    src: gps_pv_server.py.j2
    dest: "{{ epics_dir }}/gps_pv_server.py"
    owner: "{{ epics_user }}"
    group: "{{ epics_group }}"
    mode: 0755

- name: Install epics-p4p service
  template:
    src: epics-p4p.service.j2
    dest: /etc/systemd/system/epics-p4p.service
    owner: root
    group: root
    mode: 0644
  notify: Reload systemd

- name: Enable and start epics-p4p
  systemd:
    name: epics-p4p
    enabled: yes
    state: started
